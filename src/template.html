<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMBRI Tour Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a tour manager's working board, calm and factual
   IDEA: a road atlas with the route drawn in red marker
   PICTURE: the map itself, centre stage, zooming to the chosen country
   COLOUR and TYPE: graphite/bone with one marker red; Barlow Condensed like road signage, Barlow body
   LAYOUT: countries left, map centre, plan right; stacks on narrow screens */
:root{color-scheme:light dark;--bg:light-dark(#f2f0eb,#131517);--panel:light-dark(#fbfaf7,#1b1e21);--ink:light-dark(#17191c,#ebe8e1);--mute:light-dark(#62666c,#9a9ea3);--line:light-dark(#d9d5cc,#2c3035);--land:light-dark(#e4e0d6,#22262a);--land2:light-dark(#d2ccbf,#30353a);--sea:light-dark(#dfe5e8,#0e1113);--red:#d23a2a;--good:light-dark(#2f7a45,#5cbf7b);--blue:light-dark(#3b74c4,#6fa0e6);--warn:light-dark(#a3610f,#e0a24a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;margin:0;line-height:1.05}
h1{font-size:34px}h2{font-size:24px;margin-bottom:10px}h3{font-size:19px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr) 400px;height:100vh}
aside.nav{border-right:1px solid var(--line);padding:22px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.nav .sub{color:var(--mute);font-size:14px;margin:4px 0 18px}
.nav button{all:unset;cursor:pointer;display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:8px;font:600 20px 'Barlow Condensed',sans-serif;min-height:44px}
.nav button:hover{background:var(--land)}.nav button[aria-current=true]{background:var(--ink);color:var(--bg)}
.nav button:focus-visible,.route:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.nav small{font:500 13px Barlow;opacity:.7}
.legend{margin-top:auto;font-size:13px;color:var(--mute);display:grid;gap:6px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:8px;background:var(--red)}
.legend i.f{background:none;border-top:2px dashed var(--mute);height:0}
.mapwrap{position:relative;background:var(--sea)}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.maptitle{position:absolute;z-index:2;background:var(--panel);padding:4px 10px;border-radius:6px;left:18px;top:14px;font:600 15px Barlow;color:var(--mute);pointer-events:none}
.c{fill:var(--land);stroke:var(--bg);stroke-width:.6;vector-effect:non-scaling-stroke}.c.sel{fill:var(--land2)}.c.home{fill:light-dark(#e9d3cd,#3a2724)}
.lbl{font:600 13px Barlow;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round}
.lbl.k{font:600 12px Barlow;fill:var(--red)}.lbl.a{fill:var(--mute);font-weight:500}
.panel{border-left:1px solid var(--line);overflow-y:auto;padding:22px 22px 40px;background:var(--panel)}
.panel section{padding:18px 0;border-top:1px solid var(--line)}.panel section:first-of-type{border-top:0;padding-top:4px}
.lead{color:var(--mute);font-size:15px;margin:6px 0 0}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
td.p{white-space:nowrap;text-align:right;font-weight:600}td.r{white-space:nowrap;font-weight:600}td small{display:block;color:var(--mute);font-size:13px}
.route{all:unset;display:block;width:100%;cursor:pointer;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.route[aria-pressed=true]{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.route .t{font-size:13px;color:var(--mute)}
.legs{list-style:none;padding:0;margin:10px 0 6px;display:grid;gap:6px;font-size:14px}
.legs li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.night{font:600 13px Barlow;color:var(--mute);white-space:nowrap}
.km{white-space:nowrap;font-weight:600}.km.ok{color:var(--good)}.km.long{color:var(--warn)}
.route p{margin:6px 0 0;font-size:14px;color:var(--mute)}
.months{display:grid;gap:10px}.mo b{font:600 15px Barlow;display:block;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:13px;padding:4px 9px;border-radius:99px;background:var(--land);white-space:nowrap}
.chip.x{background:none;border:1px dashed var(--warn);color:var(--warn)}
.empty{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--land);margin-top:10px}
.ven{display:flex;flex-wrap:wrap;gap:6px}
.vcard{all:unset;display:block;width:100%;cursor:pointer;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-top:10px;font-size:14px}
.vcard[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.vcard b{font:600 18px 'Barlow Condensed',sans-serif}.vcard .m{color:var(--mute)}.vcard dl{display:grid;grid-template-columns:5.5em 1fr;gap:2px 8px;margin:8px 0 0}.vcard dt{color:var(--mute)}.vcard dd{margin:0;overflow-wrap:anywhere}
.vcard a{color:inherit}.conf{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--land);white-space:nowrap;margin-left:6px}
.vn{display:block;font-size:13px;color:var(--mute)}
.st{font-size:12px;padding:2px 8px;border-radius:99px;margin-left:6px;white-space:nowrap;color:#fff}.st.sent{background:var(--blue)}.st.replied{background:var(--good)}.st.off{background:var(--mute)}
.stats{font-size:14px;line-height:1.6;margin:14px 0 6px;padding:10px 12px;border-radius:8px;background:var(--land)}.live{font-size:12px;color:var(--mute)}
.pin{cursor:pointer}td small{display:block}td b{font-weight:600}
.nav button[data-k=sent]{margin-top:8px;border-top:1px solid var(--line);border-radius:0 0 8px 8px}.src{font-size:13px;color:var(--mute)}.src a{color:inherit}
@media(max-width:1000px){.app{grid-template-columns:1fr;height:auto}aside.nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:14px}
.nav .brand{width:100%}.nav .sub{margin:2px 0 8px}.legend{display:none}.mapwrap{height:58vh;min-height:340px}.panel{border-left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app">
<aside class="nav"><div class="brand"><h1>UMBRI tour</h1><p class="sub">2027 · 3 nights in one region</p></div><div class="stats" id="stats"></div><div id="nav" style="display:contents"></div>

<main class="mapwrap"><div class="maptitle" id="mt"></div><svg id="map" role="img" aria-label="Map of the selected tour region"></svg></main>
<div class="panel" id="panel"></div>
</div>

const rowsOf=ev=>{let p=ev&&ev.result&&ev.result.payload;if(p&&p.content&&!p.values)p=p.content;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p=null}}return p&&Array.isArray(p.values)?p.values:null};
const num=x=>{const n=parseFloat(String(x??'').replace(',','.'));return isFinite(n)?n:NaN};
function toVenues(rows){const H=rows[0].map(h=>String(h).toLowerCase());const ix=n=>H.findIndex(h=>h.startsWith(n));const g=(r,n)=>{const i=ix(n);return i<0?'':String(r[i]??'').replace(/^'/,'')};
 return rows.slice(1).filter(r=>g(r,'name')).map(r=>({id:g(r,'id'),name:g(r,'name'),country:g(r,'country'),city:g(r,'city'),address:g(r,'address'),lat:num(g(r,'lat')),lng:num(g(r,'lng')),cap:g(r,'capacity'),email:g(r,'booking email'),phone:g(r,'phone'),contact:g(r,'contact person'),web:g(r,'website'),social:g(r,'instagram'),photos:g(r,'photos'),fit:g(r,'metal fit'),conf:g(r,'contact confidence'),status:g(r,'status')}))}
function toSent(rows){return rows.slice(1).filter(r=>r[2]||r[5]).map(r=>({date:String(r[0]??''),id:String(r[1]??''),name:String(r[2]??''),city:String(r[3]??''),country:String(r[4]??''),email:String(r[5]??''),subject:String(r[6]??''),link:String(r[7]??''),status:String(r[8]??''),follow:String(r[9]??''),reply:String(r[10]??''),summary:String(r[11]??'')}))}

 live='Connecting to your Google Sheet…';renderNav();
 const opts={refetchInterval:120000};
