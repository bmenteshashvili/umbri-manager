<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMBRI Tour Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a tour manager's working board, calm and factual
   IDEA: a road atlas with the route drawn in red marker
   PICTURE: the map itself, centre stage, zooming to the chosen country
   COLOUR and TYPE: graphite/bone with one marker red; Barlow Condensed like road signage, Barlow body
   LAYOUT: countries left, map centre, plan right; stacks on narrow screens */
:root{color-scheme:light dark;--bg:light-dark(#f2f0eb,#131517);--panel:light-dark(#fbfaf7,#1b1e21);--ink:light-dark(#17191c,#ebe8e1);--mute:light-dark(#62666c,#9a9ea3);--line:light-dark(#d9d5cc,#2c3035);--land:light-dark(#e4e0d6,#22262a);--land2:light-dark(#d2ccbf,#30353a);--sea:light-dark(#dfe5e8,#0e1113);--red:#d23a2a;--good:light-dark(#2f7a45,#5cbf7b);--blue:light-dark(#3b74c4,#6fa0e6);--warn:light-dark(#a3610f,#e0a24a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;margin:0;line-height:1.05}
h1{font-size:34px}h2{font-size:24px;margin-bottom:10px}h3{font-size:19px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr) 400px;height:100vh}
aside.nav{border-right:1px solid var(--line);padding:22px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.nav .sub{color:var(--mute);font-size:14px;margin:4px 0 18px}
.nav button{all:unset;cursor:pointer;display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:8px;font:600 20px 'Barlow Condensed',sans-serif;min-height:44px}
.nav button:hover{background:var(--land)}.nav button[aria-current=true]{background:var(--ink);color:var(--bg)}
.nav button:focus-visible,.route:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.nav small{font:500 13px Barlow;opacity:.7}
.legend{margin-top:auto;font-size:13px;color:var(--mute);display:grid;gap:6px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:8px;background:var(--red)}
.legend i.f{background:none;border-top:2px dashed var(--mute);height:0}
.mapwrap{position:relative;background:var(--sea)}
#map{position:absolute;inset:0;width:100%;height:100%}
.maptitle{position:absolute;left:60px!important;z-index:2;background:var(--panel);padding:4px 10px;border-radius:6px;left:18px;top:14px;font:600 15px Barlow;color:var(--mute);pointer-events:none}
.c{fill:var(--land);stroke:var(--bg);stroke-width:.6;vector-effect:non-scaling-stroke}.c.sel{fill:var(--land2)}.c.home{fill:light-dark(#e9d3cd,#3a2724)}
.lbl{font:600 13px Barlow;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round}
.lbl.k{font:600 12px Barlow;fill:var(--red)}.lbl.a{fill:var(--mute);font-weight:500}
.panel{border-left:1px solid var(--line);overflow-y:auto;padding:22px 22px 40px;background:var(--panel)}
.panel section{padding:18px 0;border-top:1px solid var(--line)}.panel section:first-of-type{border-top:0;padding-top:4px}
.lead{color:var(--mute);font-size:15px;margin:6px 0 0}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
td.p{white-space:nowrap;text-align:right;font-weight:600}td.r{white-space:nowrap;font-weight:600}td small{display:block;color:var(--mute);font-size:13px}
.route{all:unset;display:block;width:100%;cursor:pointer;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.route[aria-pressed=true]{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.route .t{font-size:13px;color:var(--mute)}
.legs{list-style:none;padding:0;margin:10px 0 6px;display:grid;gap:6px;font-size:14px}
.legs li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.night{font:600 13px Barlow;color:var(--mute);white-space:nowrap}
.km{white-space:nowrap;font-weight:600}.km.ok{color:var(--good)}.km.long{color:var(--warn)}
.route p{margin:6px 0 0;font-size:14px;color:var(--mute)}
.months{display:grid;gap:10px}.mo b{font:600 15px Barlow;display:block;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:13px;padding:4px 9px;border-radius:99px;background:var(--land);white-space:nowrap}
.chip.x{background:none;border:1px dashed var(--warn);color:var(--warn)}
.empty{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--land);margin-top:10px}
.ven{display:flex;flex-wrap:wrap;gap:6px}
.vcard{all:unset;display:block;width:100%;cursor:pointer;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-top:10px;font-size:14px}
.vcard[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.vcard b{font:600 18px 'Barlow Condensed',sans-serif}.vcard .m{color:var(--mute)}.vcard dl{display:grid;grid-template-columns:5.5em 1fr;gap:2px 8px;margin:8px 0 0}.vcard dt{color:var(--mute)}.vcard dd{margin:0;overflow-wrap:anywhere}
.vcard a{color:inherit}.conf{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--land);white-space:nowrap;margin-left:6px}
.vn{display:block;font-size:13px;color:var(--mute)}
.st{font-size:12px;padding:2px 8px;border-radius:99px;margin-left:6px;white-space:nowrap;color:#fff}.st.sent{background:var(--blue)}.st.replied{background:#c58a10}.st.positive{background:#22b14c}.st.off{background:var(--mute)}
.stats{font-size:14px;line-height:1.6;margin:14px 0 6px;padding:10px 12px;border-radius:8px;background:var(--land)}.live{font-size:12px;color:var(--mute)}
.pin{cursor:pointer}
#map{cursor:grab;touch-action:none}
#lmap{position:absolute;inset:0;display:none;background:var(--sea)}#lmap.on{display:block}
.vpin{background:none;border:0}.vpin i{display:block;width:100%;height:100%;background:#fff;border:2px solid #222;transform:rotate(45deg);border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.vpin.sent i{background:#3b74c4}.vpin.replied i{background:#e0a21b}.vpin.positive i{background:#22b14c;border-color:#fff;border-radius:50%;transform:none;box-shadow:0 0 0 3px rgba(34,177,76,.35),0 1px 4px rgba(0,0,0,.4)}.vpin.off i{background:#999}.vpin.sel i{background:#d23a2a;border-color:#fff}
.kmlbl{font:700 12px Barlow,sans-serif;color:#d23a2a;text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap}
.apt{border:2px solid #333;background:#fff;border-radius:2px}
.leaflet-tooltip.clbl{font:600 13px Barlow,sans-serif;background:rgba(255,255,255,.9);border:0;box-shadow:none;padding:1px 5px}
.leaflet-container{font:14px Barlow,sans-serif}
.pop h3{font:600 20px 'Barlow Condensed',sans-serif;margin:0}.pop .m{color:#666;font-size:13px;margin:2px 0 8px}
.car figure.ig{flex:0 0 100%;scroll-snap-align:start;margin:0}.car figure.ig iframe{width:100%;height:420px;border:0;border-radius:8px;background:#fff}
.car{position:relative;margin:0 -2px}.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px;border-radius:8px;scrollbar-width:none}.track::-webkit-scrollbar{display:none}
.track figure{flex:0 0 100%;margin:0;scroll-snap-align:center}.track img{width:100%;height:190px;object-fit:cover;border-radius:8px;display:block;background:#eee}
.track figcaption{font-size:11px;color:#777;margin-top:3px;line-height:1.3;overflow-wrap:anywhere}.track figcaption a{color:inherit}
.car button{position:absolute;top:78px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}.car .pv{left:6px}.car .nx{right:6px}
.cnt{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:1px 8px;border-radius:99px}
.nophoto{font-size:13px;color:#666;padding:14px;border:1px dashed #ccc;border-radius:8px;text-align:center}
.pop dl{display:grid;grid-template-columns:4.8em 1fr;gap:2px 8px;margin:8px 0 0;font-size:13px}.pop dt{color:#777}.pop dd{margin:0;overflow-wrap:anywhere}
.pop .more{display:inline-block;margin-top:8px;font-size:13px}
.leaflet-popup-content{margin:12px 14px;width:300px!important}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}#map.drag{cursor:grabbing}
.zoom{position:absolute;right:14px;bottom:14px;z-index:2;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 22px Barlow,sans-serif;cursor:pointer}
.zoom button:focus-visible{outline:2px solid var(--red)}
.hint{position:absolute;left:18px;bottom:14px;z-index:2;font-size:12px;color:var(--mute);background:var(--panel);padding:4px 10px;border-radius:6px;pointer-events:none}td small{display:block}td b{font-weight:600}
.nav button[data-k=sent]{margin-top:8px;border-top:1px solid var(--line);border-radius:0 0 8px 8px}.src{font-size:13px;color:var(--mute)}.src a{color:inherit}
@media(max-width:1000px){.app{grid-template-columns:1fr;height:auto}aside.nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:14px}
.nav .brand{width:100%}.nav .sub{margin:2px 0 8px}.legend{display:none}.mapwrap{height:58vh;min-height:340px}.panel{border-left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

 <div class="months" style="margin-top:12px">${Object.entries(W).map(([m,ws])=>`<div class="mo"><b>${new Date(Date.UTC(2027,m-1,1)).toLocaleString('en',{month:'long',timeZone:'UTC'})}</b><div class="chips">${ws.map(w=>`<span class="chip${w.flag?' x':''}" title="${esc(w.flag||'')}">${esc(w.lab)}${w.flag?' ⚠':''}</span>`).join('')}</div></div>`).join('')}</div>
 <p class="src" style="margin-top:10px">Club season is Feb–May and Sep–Nov. ⚠ marks a holiday weekend (hover to see it). Holiday dates are approximate.</p></section>
 <section class="src">Driving times: Mapbox routing, typical traffic. Flights: Kayak, Skyscanner, Trip.com, Expedia and airBaltic listings, Nov 2026.</section>`;
 document.querySelectorAll('.route').forEach(b=>b.addEventListener('click',()=>{route=b.dataset.r;selV=null;render()}));
 const fb=()=>rt?rbox(rt):cbox(c);bindCards(fb);
 const v=selV&&VENUES.find(x=>x.id===selV);
 if(!keepView||!tgt)setVB(fit(v&&v.lat&&v.country===c.name?[v.lng-1.6,v.lat-1,v.lng+1.6,v.lat+1]:fb()));
 draw();if(v){const el=document.querySelector(`.vcard[data-v="${CSS.escape(v.id)}"]`);el&&el.scrollIntoView({block:'center'})}}
function go(){ensureCountries();const k=location.hash.slice(1);const nk=k==='sent'||COUNTRIES[k]?k:'romania';if(nk!==cur){cur=nk;route=null;const sv=selV&&VENUES.find(x=>x.id===selV);if(!sv||(nk!=='sent'&&sv.country!==COUNTRIES[nk].name))selV=null}render()}

/* pan & zoom */
let moved=false,redrawT=0;const ptrs=new Map();let start=null;
const settle=()=>{clearTimeout(redrawT);redrawT=setTimeout(()=>{tgt=vb.slice();draw()},140)};
const toSvg=(cx,cy)=>{const r=svg.getBoundingClientRect();return [vb[0]+(cx-r.left)/r.width*vb[2],vb[1]+(cy-r.top)/r.height*vb[3]]};
function zoomAt(f,cx,cy){cancelAnimationFrame(anim);const w=Math.min(800,Math.max(1.5,vb[2]*f)),k=w/vb[2];const [px,py]=cx==null?[vb[0]+vb[2]/2,vb[1]+vb[3]/2]:toSvg(cx,cy);vb=[px-(px-vb[0])*k,py-(py-vb[1])*k,vb[2]*k,vb[3]*k];svg.setAttribute('viewBox',vb.join(' '));settle()}
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(e.deltaY*(e.ctrlKey?0.01:0.0018)),e.clientX,e.clientY)},{passive:false});
svg.addEventListener('dblclick',e=>{e.preventDefault();zoomAt(0.5,e.clientX,e.clientY)});
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=false;cancelAnimationFrame(anim);start={vb:vb.slice(),pts:new Map(ptrs)}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);const r=svg.getBoundingClientRect(),s=start.vb[2]/r.width;
 if(ptrs.size===1){const [x0,y0]=start.pts.get(e.pointerId)||[e.clientX,e.clientY];const dx=e.clientX-x0,dy=e.clientY-y0;if(!moved&&Math.hypot(dx,dy)<4)return;if(!moved){moved=true;svg.classList.add('drag');try{svg.setPointerCapture(e.pointerId)}catch(_){}}vb=[start.vb[0]-dx*s,start.vb[1]-dy*s,start.vb[2],start.vb[3]];svg.setAttribute('viewBox',vb.join(' '))}
 else if(ptrs.size===2){moved=true;const [a,b]=[...ptrs.values()],[a0,b0]=[...start.pts.values()];if(!a0||!b0)return;const d=Math.hypot(a[0]-b[0],a[1]-b[1]),d0=Math.hypot(a0[0]-b0[0],a0[1]-b0[1])||1;const k=Math.min(800,Math.max(1.5,start.vb[2]*d0/d))/start.vb[2];const mx=(a0[0]+b0[0])/2,my=(a0[1]+b0[1])/2,px=start.vb[0]+(mx-r.left)*s,py=start.vb[1]+(my-r.top)*s;vb=[px-(px-start.vb[0])*k,py-(py-start.vb[1])*k,start.vb[2]*k,start.vb[3]*k];svg.setAttribute('viewBox',vb.join(' '))}});
const up=e=>{ptrs.delete(e.pointerId);svg.classList.remove('drag');if(moved)settle();start={vb:vb.slice(),pts:new Map(ptrs)};setTimeout(()=>{if(!ptrs.size)moved=false},0)};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
document.getElementById('zin').onclick=()=>zoomAt(0.6);document.getElementById('zout').onclick=()=>zoomAt(1.6);
document.getElementById('zfit').onclick=()=>{selV=null;render()};
addEventListener('hashchange',go);
let lastW=0;const ro=new ResizeObserver(()=>{const w=svg.clientWidth;if(cur&&tgt&&Math.abs(w-lastW)>40){lastW=w;vb=null;render(false)}});ro.observe(svg);
go();
/* live data from the Google Sheet */
const rowsOf=ev=>{let p=ev&&ev.result&&ev.result.payload;if(p&&p.content&&!p.values)p=p.content;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p=null}}return p&&Array.isArray(p.values)?p.values:null};
const num=x=>{const n=parseFloat(String(x??'').replace(',','.'));return isFinite(n)?n:NaN};
function toVenues(rows){const H=rows[0].map(h=>String(h).toLowerCase());const ix=n=>H.findIndex(h=>h.startsWith(n));const g=(r,n)=>{const i=ix(n);return i<0?'':String(r[i]??'').replace(/^'/,'')};
 return rows.slice(1).filter(r=>g(r,'name')).map(r=>({id:g(r,'id'),name:g(r,'name'),country:g(r,'country'),city:g(r,'city'),address:g(r,'address'),lat:num(g(r,'lat')),lng:num(g(r,'lng')),cap:g(r,'capacity'),email:g(r,'booking email'),phone:g(r,'phone'),contact:g(r,'contact person'),web:g(r,'website'),social:g(r,'instagram'),photos:g(r,'photos'),fit:g(r,'metal fit'),conf:g(r,'contact confidence'),status:g(r,'status')}))}
function toSent(rows){return rows.slice(1).filter(r=>r[2]||r[5]).map(r=>({date:String(r[0]??''),id:String(r[1]??''),name:String(r[2]??''),city:String(r[3]??''),country:String(r[4]??''),email:String(r[5]??''),subject:String(r[6]??''),link:String(r[7]??''),status:String(r[8]??''),follow:String(r[9]??''),reply:String(r[10]??''),summary:String(r[11]??'')}))}
let GVN=0;function gviz(sheet){return new Promise((res,rej)=>{const cb='__gv'+(++GVN);const sc=document.createElement('script');const t=setTimeout(()=>{cleanup();rej('timeout')},15000);
 function cleanup(){clearTimeout(t);delete window[cb];sc.remove()}
 window[cb]=d=>{cleanup();try{if(!d||d.status==='error')return rej('error');const T=d.table;const H=T.cols.map(c=>c.label||'');const R=T.rows.map(r=>(r.c||[]).map(c=>c==null?'':(c.f!=null&&typeof c.v!=='number'?c.f:(c.v==null?'':c.v))));res([H,...R])}catch(e){rej(e)}};
 sc.onerror=()=>{cleanup();rej('load')};sc.src='https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=responseHandler:'+cb+'&headers=1&sheet='+encodeURIComponent(sheet)+'&_='+Date.now();document.head.appendChild(sc)})}
async function gvizLive(){live='Connecting to the Google Sheet…';renderNav();
 const tick=async()=>{try{const [v,s]=await Promise.all([gviz('Venues'),gviz('Sent')]);if(v.length>1){VENUES=toVenues(v);ensureCountries()}if(s.length>1)SENT=toSent(s);live='Live from Google Sheet · checked '+stamp();if(cur!=='sent'&&!COUNTRIES[cur])cur='romania';render(true)}catch(e){live='Saved copy ('+BUILT+') · live sheet not reachable';renderNav()}};
 await tick();setInterval(tick,120000)}
const stamp=()=>new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
(async()=>{let mcp=null;try{mcp=window.claude&&await window.claude.use('mcp')}catch(e){}
 if(!mcp){gvizLive();return}
 live='Connecting to your Google Sheet…';renderNav();
 const opts={refetchInterval:120000};
 const onErr=ev=>{if(ev&&ev.type==='error'){live='Live update failed · showing last data';renderNav()}};
 try{mcp.watchTool('Google Sheets','get_values',{spreadsheetId:SHEET,range:'Venues!A1:S3000'},ev=>{onErr(ev);const rows=ev&&ev.type==='data'&&rowsOf(ev);if(rows&&rows.length>1){VENUES=toVenues(rows);live='Live from Google Sheet · updated '+stamp();ensureCountries();const hk=location.hash.slice(1);if(COUNTRIES[hk]&&cur!==hk){cur=hk;route=null;render()}else{if(cur!=='sent'&&!COUNTRIES[cur])cur='romania';render(true)}}},opts);
  mcp.watchTool('Google Sheets','get_values',{spreadsheetId:SHEET,range:'Sent!A1:L3000'},ev=>{onErr(ev);const rows=ev&&ev.type==='data'&&rowsOf(ev);if(rows){SENT=toSent(rows);render(true)}},opts)}catch(e){live='Live data not available · showing saved copy';renderNav()}})();
}
